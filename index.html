<style>
@font-face{font-family:Pagella;src:url(pagella.otf)}
:root{--bg:#F3EEE6;--sup:#FBF8F3;--bor:#E0D4C4;--bor2:#D3C4B1;--hov:#EBE2D5;--fg:#2A1A12;--mut:#6B4A35;--pri:#BC7B69;--pri-t:#8F5444;--ok:#3E5A3A;--serif:'Pagella','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 140px;display:flex;flex-direction:column;gap:12px}
.logo{display:block;width:min(290px,78vw);margin:0 auto}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:0}
.card{background:var(--sup);border:1px solid var(--bor);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(42,26,18,.06)}
.tit{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.2;margin:0 0 2px}
.mut{color:var(--mut)}.xs{font-size:12px}.sm{font-size:14px}
.ind{display:flex;align-items:flex-start;margin:4px 0 2px}
.ind .p{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font-size:11px;color:var(--mut);text-align:center;line-height:1.15}
.ind .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--hov);color:var(--mut);border:1px solid var(--bor2)}
.ind .act .n{background:var(--pri);color:var(--fg);border-color:var(--pri)}.ind .act{color:var(--fg);font-weight:600}
.ind .ok .n{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ind .l{flex:1;height:2px;background:var(--bor2);margin-top:15px}.ind .l.ok{background:var(--fg)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod{padding:8px 0}
.cant{display:flex;align-items:center;gap:4px}
.cant button{width:48px;height:48px;border-radius:50%;border:1px solid var(--bor);background:transparent;color:var(--pri-t);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation}
.cant button.mas{background:var(--pri);border-color:var(--pri);color:var(--fg)}
.cant .num{font-size:22px;font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
label.c{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sup);border:1px solid var(--bor2);border-radius:6px;padding:15px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.tel{display:flex;gap:8px}
.pref{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border:1px solid var(--bor2);border-radius:6px;background:var(--hov);font-weight:600;flex-shrink:0}
.pref svg{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.trampa{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.barra{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--bor);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.barra .btn{white-space:nowrap;width:auto;padding:0 14px}.barra #atras{padding:0 6px}.barra .in>div:first-child{flex-shrink:0}@media (max-width:380px){.barra #atras{display:none!important}}#unid{white-space:nowrap}
.volver{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}.volver .btn{display:inline-flex!important;width:auto!important;height:auto!important;min-height:32px;margin:0!important;padding:4px 0!important;font-size:14px}
.ind [data-ir]{cursor:pointer}.ind [data-ir]:hover .n{filter:brightness(1.15)}.barra #sig{flex:0 1 auto}
.barra .in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.barra .tot{font-size:20px;font-weight:700;line-height:1.1}
.btn{height:52px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:600;background:var(--pri);color:var(--fg);padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.g{flex:1}.btn.sec{background:transparent;color:var(--pri-t);padding:0 14px}
.btn.out{background:transparent;border:1px solid var(--pri);color:var(--pri-t);width:100%;height:46px;border-radius:12px;font-size:15px}
.btn.wa{background:#2E7D4F;color:#fff;width:100%}
.btn.cp{background:var(--pri);width:100%;height:46px;border-radius:12px;font-size:15px;margin:6px 0 4px}
.mini{width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.dato{display:flex;align-items:center;justify-content:space-between;padding:4px 0;gap:8px}
.dato b{font-weight:500;font-size:16px;word-break:break-all}
.dato button{background:none;border:0;color:var(--pri-t);font-size:13px;font-weight:600;cursor:pointer;padding:8px}
hr{border:0;border-top:1px solid var(--bor);margin:8px 0}
.aviso{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;display:none}
[hidden]{display:none!important}
.opc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bor2);border-radius:12px;padding:12px;margin-top:8px;cursor:pointer}
.opc.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#F6EDE6}
.gratis{background:#E4EBDF;color:var(--ok);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.prog{height:6px;border-radius:99px;background:var(--hov);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}
.opc input{width:20px;height:20px;margin:2px 0 0;flex-shrink:0;accent-color:var(--pri-t);padding:0}
select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sup);border:1px solid var(--bor2);border-radius:6px;padding:15px 14px;outline:none;-webkit-appearance:none;appearance:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg button{min-height:64px;border-radius:14px;border:1.5px solid var(--bor2);background:var(--sup);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;padding:8px;line-height:1.2;touch-action:manipulation}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.seg button.sel{border-color:var(--pri);background:#F6EDE6;box-shadow:inset 0 0 0 1px var(--pri)}
.atajos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.atajos button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--bor2);background:var(--sup);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation}
.dcto{display:inline-block;background:var(--pri);color:var(--fg);font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.banda{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;text-align:center}
gmp-place-autocomplete{width:100%;color-scheme:light}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bor)}
.cl:first-of-type{border-top:0}.cl .q{border:0;background:transparent;color:var(--pri-t);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 4px;min-height:40px}
.cl .mini2{display:flex;align-items:center;gap:2px}.cl .mini2 button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bor2);background:var(--sup);color:var(--fg);font:inherit;font-size:18px;cursor:pointer}
.dias{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dias button{min-height:48px;min-width:88px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--bor2);background:var(--sup);color:var(--fg);font:inherit;cursor:pointer;line-height:1.15;touch-action:manipulation}
.dias button small{display:block;font-size:12px;color:var(--mut)}
.dias button.sel{background:var(--pri);border-color:var(--pri);color:#fff}.dias button.sel small{color:#fff}
.nav{border:1.5px solid var(--pri);background:#F6EDE6}
.nav h2{margin:0}.tam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}@media (max-width:380px){.tam{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tam button{min-width:0;min-height:56px;line-height:1.15;padding:6px 4px;border-radius:12px;border:1.5px solid var(--bor2);background:var(--sup);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.tam button.sel{background:var(--pri);border-color:var(--pri)}
.cajita{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bor)}
.cajita button.q{border:0;background:transparent;color:var(--pri-t);font:inherit;text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <img class="logo" src="logo.svg" alt="Vicencio · alfajores artesanales">
  <p class="sub" id="sub">Cargando…</p>
  <div id="cuerpo"></div>
</div>
<div class="barra" id="barra" hidden>
  <div class="in">
    <div><div class="mut xs" id="unid">0 alfajores</div><div class="tot" id="tot">$0</div></div>
    <div style="display:flex;gap:8px;flex:1;justify-content:flex-end">
      <button class="btn sec" id="atras" hidden>← Atrás</button>
      <button class="btn g" id="sig" disabled>Continuar →</button>
    </div>
  </div>
</div>
<div class="aviso" id="aviso"></div>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const peso = (n) => "$" + Math.round(n).toLocaleString("es-CL");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BANDERA = '<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#fff"/><rect y="30" width="90" height="30" fill="#D52B1E"/><rect width="30" height="30" fill="#0039A6"/><polygon points="15,5 17.5,11.6 24.5,11.9 19,16.3 20.9,23.1 15,19.2 9.1,23.1 11,16.3 5.5,11.9 12.5,11.6" fill="#fff"/></svg>';
const NOMBRES = ["Carrito", "Envío", "Pago", "Listo"];
const st = { paso: 1, cat: null, cant: {}, cajas: [], arma: null, medio: "", fecha: "", codigo: "", vista: "", programar: false, fechaProg: "", entrega: "despacho", comuna: "", otra: "", direccion: "", ref: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)), enviando: false };

// Ninguna consulta queda colgada para siempre (si no, el botón se quedaría en "Enviando…"): el mapa espera 7 s, el resto 40 s.
(() => { const f0 = window.fetch.bind(window);
  window.fetch = (u, o) => { o = o || {}; if (o.signal || !window.AbortController) return f0(u, o);
    const c = new AbortController(), t = setTimeout(() => c.abort(), String(u).includes("nominatim") ? 7000 : 40000);
    return f0(u, Object.assign({}, o, { signal: c.signal })).finally(() => clearTimeout(t)); }; })();
const nuevoRef = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
async function api(datos) {
  const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(datos) });
  return r.json();
}
// Ventana de pregunta propia (el navegador no muestra confirm() en todos lados). botones: [[texto, clase, accion]]
function preguntar(titulo, texto, botones, alCerrar) {
  if ($("#pregunta")) $("#pregunta").remove();
  const f = document.createElement("div"); f.id = "pregunta";
  f.style.cssText = "position:fixed;inset:0;z-index:60;background:rgba(42,26,18,.45);display:flex;align-items:flex-end;justify-content:center";
  f.innerHTML = `<div role="dialog" aria-modal="true" style="background:var(--sup);width:100%;max-width:520px;max-height:90vh;overflow:auto;box-sizing:border-box;border-radius:20px 20px 0 0;padding:22px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)">
    <h2 class="tit">${titulo}</h2><div class="mut sm">${texto}</div>
    ${botones.map((b, i) => `<button class="btn ${b[1]}" data-i="${i}" style="margin-top:10px;width:100%">${b[0]}</button>`).join("")}</div>`;
  document.body.appendChild(f);
  const cerrar = () => { f.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") { cerrar(); if (alCerrar) alCerrar(); } };
  document.addEventListener("keydown", esc);
  f.onclick = (e) => { if (e.target === f) { cerrar(); if (alCerrar) alCerrar(); } };
  f.querySelectorAll("button[data-i]").forEach((b) => b.onclick = () => { cerrar(); botones[Number(b.dataset.i)][2](); });
}
// El carrito y los datos se guardan en la pestaña: si el cliente recarga o vuelve atrás, no pierde nada.
const CAMPOS_SESION = ["paso", "ref", "editando", "retiroZona", "cant", "cajas", "codigo", "vista", "entrega", "comuna", "otra", "modoOtra", "direccion", "depto", "fecha", "programar", "fechaProg", "nombre", "tel", "correo", "medio"];
function guardarSesion() {
  if (!st.cat || st.paso >= NOMBRES.length) return;
  if (st.paso === 2) leerCampos();
  try { const o = {}; CAMPOS_SESION.forEach((k) => o[k] = st[k]); sessionStorage.setItem("av_sesion", JSON.stringify(o)); } catch (e) {}
}
function borrarSesion() { try { sessionStorage.removeItem("av_sesion"); } catch (e) {} }
function leerSesion() { try { return JSON.parse(sessionStorage.getItem("av_sesion") || "null"); } catch (e) { return null; } }

function avisar(t) { const a = $("#aviso"); a.textContent = t; a.style.display = "block"; clearTimeout(avisar.t); avisar.t = setTimeout(() => a.style.display = "none", Math.min(7000, 2500 + String(t).length * 45)); }
function sabor(n) { return String(n).trim().toLowerCase().replace(/^alfajor(es)?\s+(de\s+)?/, ""); }
function frase(ls) {
  const cj = ls.filter((l) => /^caja de navidad/i.test(l.nombre)); ls = ls.filter((l) => !/^caja de navidad/i.test(l.nombre));
  const extra = cj.map((l) => `${l.cantidad} caja${l.cantidad !== 1 ? "s" : ""} de Navidad`);
  if (!ls.length) return extra.join(" y ");
  const p0 = frase0(ls);
  return extra.length ? p0 + " (" + extra.join(" y ") + " incluidas)" : p0;
}
function frase0(ls) {
  const p = ls.map((l) => { let r = String(l.nombre).trim().toLowerCase().replace(/^alfajor(es)?\s*/, "");
    if (l.cantidad !== 1 && !r.startsWith("de ") && r && !r.endsWith("s")) r += "s";
    return `${l.cantidad} alfajor${l.cantidad !== 1 ? "es" : ""} ${r}`.trim(); });
  return p.length === 1 ? p[0] : p.slice(0, -1).join(", ") + " y " + p[p.length - 1];
}
function waNum(d) { d = String(d).replace(/\D/g, ""); return d.length === 9 ? "56" + d : d; }
function lineasActuales() { return st.cat.productos.filter((p) => st.cant[p.id] > 0).map((p) => ({ producto_id: p.id, nombre: p.nombre, cantidad: st.cant[p.id], precio: p.precio })); }
const OTRA = "__otra";
function sinTildes(t) { return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }

function despachoActivo() { return !!(st.cat && st.cat.despacho && st.cat.despacho.activo); }
function comunaZona() { return !!(st.cat && st.cat.despacho && (st.cat.despacho.comunas || []).indexOf(st.comuna) >= 0); }
function comunaElegida() { return st.comuna === OTRA ? (st.otra || "").trim() : st.comuna; }
const esOtra = () => st.comuna === OTRA;
const esOtraTxt = (c) => /\(otra comuna\)/i.test(c || "");
const sinOtra = (c) => String(c || "").replace(/\s*\(otra comuna\)/i, "");
// Texto de entrega de un pedido ya hecho (pago, pantalla final): domicilio, retiro en Las Condes o punto con código.
function lugarPedido(ped) {
  if (ped.entrega === "despacho") return `🚗 A domicilio: ${esc(ped.direccion || "")}${ped.direccion ? ", " : ""}${esc(sinOtra(ped.comuna))}`;
  if (esOtraTxt(ped.comuna)) return /Con código/.test(ped.nota || "") || st.codigo ? "📍 Entrega en un punto a coordinar entre ambos" : "📍 Retiro gratis en un punto a coordinar en Las Condes";
  return "📍 Retiro gratis en un punto a coordinar en Las Condes";
}
const costoOtras = () => Number(((st.cat || {}).despacho || {}).costo_otras ?? 5000);
const minimoOtras = () => Number(((st.cat || {}).despacho || {}).minimo_otras ?? 15000);
const gratisOtras = () => Number(((st.cat || {}).despacho || {}).gratis_otras ?? 20000);   // otras comunas: envío gratis desde
const minimoPedido = () => Number(((st.cat || {}).despacho || {}).minimo_pedido ?? 5000);   // mínimo para envío en tus comunas
// Cómo se entrega: en la zona, a domicilio; en otra comuna, retiro gratis en Las Condes o envío con mínimo (con código: punto a coordinar).
// En tus comunas, un pedido bajo el mínimo puede retirarse gratis en Las Condes.
const bajoMinimoZona = () => !esOtra() && totales()[0] < minimoPedido();
function modoEntrega() { if (!despachoActivo()) return "retiro"; if (!esOtra()) return st.retiroZona && bajoMinimoZona() ? "retiro" : "despacho"; return st.codigo ? "retiro" : (st.modoOtra || ""); }
function envioActual() {   // misma regla que el servidor
  if (!despachoActivo() || modoEntrega() === "retiro") return 0;   // retiro: gratis
  if (esOtra()) return modoEntrega() === "despacho" && !(gratisOtras() && totales()[0] >= gratisOtras()) ? costoOtras() : 0;   // otra comuna: tarifa fija (gratis desde el umbral) o retiro gratis
  if (st.codigo) return 0;     // con código: envío gratis
  const r = st.cat.despacho, sub = totales()[0];
  return sub >= Number(r.minimo || 0) ? 0 : Number(r.costo || 0);
}
function totales() { let t = 0, u = 0; st.cat.productos.forEach((p) => { t += (st.cant[p.id] || 0) * p.precio; u += (st.cant[p.id] || 0) * (p.navidad || 1); }); return [t, u]; }
const alfajores = () => st.cat.productos.filter((p) => !p.navidad);
const cajasCat = () => st.cat.productos.filter((p) => p.navidad);
const negroId = () => (alfajores().find((p) => /negro/i.test(p.nombre)) || {}).id;
const blancoId = () => (alfajores().find((p) => /blanco/i.test(p.nombre)) || {}).id;
function piso(id) { return 0; }

function indicador() {
  let h = "";
  const fin = st.paso >= NOMBRES.length;   // pedido pagado o comprobante recibido: todo en ✓
  NOMBRES.forEach((n, i) => { const k = i + 1, hecho = fin || k < st.paso, c = hecho ? "ok" : k === st.paso ? "act" : "";
    const ir = !fin && k < st.paso;   // los pasos ya hechos se pueden tocar para volver
    h += `<div class="p ${c}"${ir ? ` data-ir="${k}" role="button" tabindex="0" style="cursor:pointer" aria-label="Volver a ${n}"` : ""}><div class="n">${hecho ? "✓" : k}</div>${n}</div>`;
    if (k < NOMBRES.length) h += `<div class="l ${fin || k < st.paso ? "ok" : ""}"></div>`; });
  return `<div class="ind">${h}</div>`;
}

function dibujarCajas() {
  const el = $("#navidad"); if (!el) return;
  const cj = cajasCat(), a = st.arma;
  const tams = `<div class="tam">${cj.map((p) => `<button data-t="${p.navidad}" class="${a && a.tam === p.navidad ? "sel" : ""}"><span style="font-size:18px">${p.navidad}</span> <small style="font-weight:500">alfajores</small><br><small style="font-weight:400">${precioTxt(p)}</small></button>`).join("")}</div>`;
  let cuerpo = "";
  if (a) {
    const c = cj.find((p) => p.navidad === a.tam), falta = a.tam - a.neg - a.bla;

async function recargarPrecios() {   // vuelve a los precios normales del catálogo
  try { const c = await (await fetch(window.API_URL)).json(); if (c.ok) { const pr = {}; c.productos.forEach((p) => pr[p.id] = p);
    st.cat.productos.forEach((p) => { const n = pr[p.id]; if (n) { p.precio = n.precio; if (n.antes) p.antes = n.antes; else delete p.antes; } }); } } catch (e) {}
}

async function aplicarCodigo(dado, silencioso) {
  const codigo = (dado || ($("#codigo") || {}).value || "").trim();
  if (!codigo) { if (!silencioso) avisar("Escribe tu código."); return; }
  try {
    const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ accion: "amigo", codigo: codigo }) });
    const d = await r.json();
    if (!d.ok) { if (!silencioso) avisar(d.error || "Ese código no es válido."); else st.codigo = ""; return; }
    const pr = {}; (d.productos || []).forEach((p) => pr[p.id] = p);
    st.cat.productos.forEach((p) => { const n = pr[p.id]; if (n) { p.precio = n.precio; if (n.antes) p.antes = n.antes; else delete p.antes; } });
    st.codigo = codigo; if (st.paso === 1) dibujarPaso1(); barra(); if (!silencioso) avisar("✓ Código aplicado");
  } catch (e) { if (!silencioso) avisar("Sin conexión. Intenta de nuevo."); }
}

// Días de entrega que alcanzan para este pedido (el tope por día no se muestra: si no alcanza, el día no aparece).
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function fechaObj(f) { const p = f.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fechaLarga(f) { const d = fechaObj(f); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; }
// "Pide hasta el domingo 13 a las 20:00" o, si queda menos de un día, "Cierra en 5 h".
function textoCierre(c) {
  const [f, h] = c.split(" "), p = f.split("-").map(Number), hh = h.split(":").map(Number);
  const fin = new Date(p[0], p[1] - 1, p[2], hh[0], hh[1]), falta = fin - Date.now();
  if (falta > 0 && falta < 864e5) { const hrs = Math.floor(falta / 36e5), min = Math.max(1, Math.round((falta % 36e5) / 6e4));
    return `⏳ Para este día <b>cierra en ${hrs ? hrs + " h " : ""}${hrs ? "" : min + " min"}</b>`; }
  return `⏳ Pide hasta el <b>${DIAS[fechaObj(f).getDay()]} a las ${h}</b>`;
}
// "$1.000" o, si hay descuento, "$1.000 $1.200" con el normal tachado.
function pctDesc(p) { return p.antes ? Math.round((1 - p.precio / p.antes) * 100) : 0; }
function precioTxt(p) { return p.antes ? `${peso(p.precio)} <s style="opacity:.6;font-weight:400">${peso(p.antes)}</s> <span class="dcto">-${pctDesc(p)}%</span>` : peso(p.precio); }
function hoyLocal() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const FERIADOS = ["2026-12-08", "2026-12-25", "2027-01-01"];   // mismos que en el servidor
function esHabil(f) { const d = fechaObj(f).getDay(); return d !== 0 && d !== 6 && !FERIADOS.includes(f); }
function sumarHabiles(f, n) { let x = f; while (n > 0) { x = sumarDiasLocal(x, 1); if (esHabil(x)) n--; } return x; }
function sumarDiasLocal(f, n) { const d = fechaObj(f); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
// La campaña de Navidad terminó si hay agenda pero ya no quedan días: entonces no se ofrecen las cajas.
function campanaCerrada() { const a = st.cat && st.cat.agenda; return !!(a && a.activo && !(a.dias || []).length); }
function agendaActiva() { return !!(st.cat.agenda && st.cat.agenda.activo) && st.cajas.length > 0; }   // el día de entrega es solo para las Cajas de Navidad
function diasPosibles() { const u = totales()[1]; return ((st.cat.agenda || {}).dias || []).filter((x) => x.libre >= u); }

function listaComunas(c) { c = c || []; return c.length > 1 ? c.slice(0, -1).join(", ") + " y " + c[c.length - 1] : (c[0] || ""); }
function resumenPaso2() {   // resumen del pedido como en un carrito: subtotal, envío y total
  const el = $("#resumen"); if (!el) return;
  const [t] = totales(), e = envioActual(), modo = modoEntrega(), desp = modo === "despacho";
  el.innerHTML = lineasActuales().filter((l) => !/^caja de navidad/i.test(l.nombre)).map((l) => `<div class="fila sm"><span>${l.cantidad} × ${esc(nombreCorto(l.nombre))}</span><span>${peso(l.cantidad * l.precio)}</span></div>`).join("") +
    st.cajas.map((k) => `<div class="fila sm"><span>🎁 Caja de Navidad de ${k.tam} (${k.neg ? k.neg + " negro" + (k.neg > 1 ? "s" : "") : ""}${k.neg && k.bla ? " y " : ""}${k.bla ? k.bla + " blanco" + (k.bla > 1 ? "s" : "") : ""})</span><span>${peso((cajasCat().find((p) => p.id === k.cajaId) || {}).precio || 0)}</span></div>`).join("") +
    `<hr><div class="fila sm"><span class="mut">Subtotal</span><span>${peso(t)}</span></div>
     <div class="fila sm"><span class="mut">${desp ? "Entrega a domicilio" : modo === "retiro" ? (esOtra() && st.codigo ? "Punto a coordinar" : "Retiro en Las Condes") : "Entrega"}</span><span>${!desp ? (esOtra() && !modo ? "elige cómo" : "Gratis") : e ? peso(e) : "Gratis"}</span></div>
     <hr><div class="fila"><span style="font-weight:600;font-size:16px">Total</span><span style="font-weight:700;font-size:20px">${peso(t + (e || 0))}</span></div>`;
}

function copiar(t, msg) {
  const ok = () => avisar(msg || "Copiado ✅");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => fallback());
  else fallback();
  function fallback() { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (e) { avisar("No pude copiar, hazlo a mano."); } a.remove(); }
}

function leerImagen(archivo) {
  return new Promise((ok, mal) => { const u = URL.createObjectURL(archivo), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); mal(new Error("ilegible")); }; i.src = u; });
}
// Reduce la foto para que pese poco (cabe en la hoja de Google): máx. ~1500 px y ~300 KB, en JPG con fondo blanco.
async function comprimirImagen(archivo) {
  const img = await leerImagen(archivo);
  let lado = 1500, calidad = 0.78;
  for (let n = 0; n < 7; n++) {
    const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", calidad), datos = url.split(",")[1] || "";
    if (datos.length && datos.length <= 400000) return { mime: "image/jpeg", datos: datos, url: url };
    lado = Math.round(lado * 0.8); calidad = Math.max(0.5, calidad - 0.06);
  }
  throw new Error("pesada");
}

function cargarDesdePedido(ped) {

  (ped.lineas || []).forEach((l) => { if (cat[l.producto_id]) st.cant[l.producto_id] = (st.cant[l.producto_id] || 0) + l.cantidad; });

    const sab = {}; sab[x[2]] = Number(x[3]); sab[x[4]] = Number(x[5]);
    st.cajas.push({ tam: cat[x[1]].navidad, neg: sab[negroId()] || 0, bla: sab[blancoId()] || 0, cajaId: Number(x[1]) }); });
  cajasCat().forEach((c) => { const n = st.cant[c.id] || 0, hay = st.cajas.filter((k) => k.cajaId === c.id).length;   // cajas sin detalle de sabores
    for (let i = hay; i < n; i++) st.cajas.push({ tam: c.navidad, neg: Math.ceil(c.navidad / 2), bla: Math.floor(c.navidad / 2), cajaId: c.id }); });
  st.nombre = st.nombre || ped.nombre || ""; st.correo = st.correo || ped.correo || "";

  if (ped.direccion) st.direccion = String(ped.direccion).replace(/,?\s*\(⚠[^)]*\)/, "");   // (pedidos antiguos traían una marca del mapa)
  if (st.cajas.length) st.fecha = ped.fecha_entrega || ""; else if (ped.fecha_entrega) { st.programar = true; st.fechaProg = ped.fecha_entrega; }

    <hr><div class="fila"><span style="font-weight:600;font-size:16px">Total a pagar</span><span style="font-weight:700;font-size:20px">${peso(ped.total)}</span></div></div>
  ${c.mp && !st.avisoMp ? `<div class="card" style="margin-top:12px"><h2 class="tit">Medio de pago</h2>

  </div>` : ""}
  ${elegido === "mp" ? mp : elegido === "tef" ? tef : ""}
  ${elegido ? `<div class="card" style="margin-top:12px"><div class="fila" style="justify-content:flex-start"><span class="mini">${elegido === "mp" ? 2 : 3}</span><b style="font-size:16px">Coordinamos la entrega</b></div>
    ${ped.fecha_entrega ? `<div class="sm" style="margin-top:6px">📅 <b>${fechaLarga(ped.fecha_entrega)}</b></div>` : ""}

  ${c.whatsapp ? `<a class="btn out" style="margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent("Hola! Tengo una consulta sobre mi pedido de " + frase(ped.lineas) + ".")}">💬 Tengo una consulta</a>` : ""}
  <p class="mut sm" style="text-align:center">${st.compOk ? "Puedes cerrar esta página." : "Si necesitas cerrar esta página, en tu correo tienes el botón para volver a pagar."} ¡Gracias por apoyar a Alfajores Vicencio! 🤎</p>`;
  document.querySelectorAll('input[name="medio"]').forEach((r) => r.onchange = () => { st.medio = r.value; dibujarPaso3(ped, pago); });
  // Paso 2: el cliente adjunta la captura o foto de su comprobante (se reduce en el teléfono y se guarda en la nube hasta que el ERP la baja).
  const wa = c.whatsapp
    ? `<a class="btn out" id="wacomp" style="margin-top:10px;height:auto;min-height:46px;padding:10px 14px;text-align:center;line-height:1.25" target="_blank" rel="noopener" href="${enlaceWa(texto)}">💬 Prefiero enviarlo por WhatsApp</a>`

  function pintarComp() {

      el.innerHTML = tit + `<div class="mut sm" style="margin-top:6px">Cuando hayas transferido, sube aquí la captura o foto del comprobante.</div>

    const f = $("#archivo"); if (f) f.onchange = async () => {

      catch (err) { avisar(err && err.message === "pesada" ? "La imagen es muy pesada. Prueba con una captura de pantalla." : "No pude leer esa imagen. Prueba con otra o envíala por WhatsApp."); return; }

    setTimeout(() => { const el = $("#cardcomp"); if (!el || $("#yawa")) return;

      $("#yawa").onclick = () => pantallaFinal(ped, "wa"); }, 800);
  });
  const bm = $("#pagomp"); if (bm) { bm.dataset.html = bm.innerHTML; bm.onclick = () => irAPagarMp(st.ref, bm); }
  const rm = $("#revisarmp"); if (rm) rm.onclick = (e) => { e.preventDefault(); volvioDeMp(st.ref); };
  const om = $("#otravezmp"); if (om) om.onclick = (e) => { e.preventDefault(); om.textContent = "Abriendo Mercado Pago…"; irAPagarMp(st.ref, null); };
  const cb = $("#cambiar"); if (cb) cb.onclick = cambiarPedido;
  const vc = $("#vercarro"); if (vc) vc.onclick = () => { cambiarPedido(); irA(1); };
  const b = $("#cptodo"); if (b) b.onclick = () => copiar(filas.map((f) => f[1]).join("\n"), "Datos copiados ✅ Pégalos en tu app del banco");
}

// "Tu pedido": siempre visible en el paso 1, con todo lo que lleva y cómo quitarlo.
function nombreCorto(n) { return /negro/i.test(n) ? "Negro" : /blanco/i.test(n) ? "Blanco" : sabor(n); }
function sabTxt(k) { return [k.neg ? k.neg + " negro" + (k.neg > 1 ? "s" : "") : "", k.bla ? k.bla + " blanco" + (k.bla > 1 ? "s" : "") : ""].filter(Boolean).join(" y "); }
function quitarCaja(i) {
  const k = st.cajas.splice(i, 1)[0];
  if (k) st.cant[k.cajaId] = Math.max(0, (st.cant[k.cajaId] || 0) - 1);
  dibujarPaso1(); barra();
}
function dibujarCarrito() {
  const el = $("#carrito"); if (!el) return;
  const sueltos = alfajores().filter((p) => (st.cant[p.id] || 0) > 0);
  if (!st.cajas.length && !sueltos.length) { el.hidden = true; return; }
  el.hidden = false;
  const precioCaja = (id) => (cajasCat().find((p) => p.id === id) || {}).precio || 0;
  el.innerHTML = `<div class="fila" style="margin-bottom:4px"><h2 class="tit" style="margin:0">🛒 Tu pedido</h2><b>${peso(totales()[0])}</b></div>` +
    `<div style="text-align:right;margin:-4px 0 4px"><a href="#" id="vaciar" class="xs" style="color:var(--mut)">Vaciar pedido</a></div>` +
    st.cajas.map((k, i) => `<div class="cl"><div style="min-width:0"><div style="font-weight:500">🎁 Caja de ${k.tam}</div><div class="mut sm">${sabTxt(k)} · ${peso(precioCaja(k.cajaId))}</div></div>
      <button class="q" data-qc="${i}">Quitar</button></div>`).join("") +
    sueltos.map((p) => `<div class="cl"><div style="min-width:0"><div style="font-weight:500">${/negro/i.test(p.nombre) ? "⚫ Negros" : /blanco/i.test(p.nombre) ? "⚪ Blancos" : esc(sabor(p.nombre))} a granel</div><div class="mut sm">${st.cant[p.id]} × ${peso(p.precio)} = ${peso(st.cant[p.id] * p.precio)}</div></div>
      <button class="q" data-qg="${p.id}">Quitar</button></div>`).join("");
  el.querySelectorAll("[data-qc]").forEach((b) => b.onclick = () => quitarCaja(Number(b.dataset.qc)));
  const vz = $("#vaciar"); if (vz) vz.onclick = (e) => { e.preventDefault();
    preguntar("¿Vaciar tu pedido?", "Se quitan todas las cajas y alfajores.", [["Sí, vaciar", "g", () => { st.cant = {}; st.cajas = []; st.arma = null; st.fecha = ""; dibujarPaso1(); barra(); }], ["No", "sec", () => {}]]); };
  el.querySelectorAll("[data-qg]").forEach((b) => b.onclick = () => {   // las cantidades se cambian con + y − de "Alfajores a granel"; aquí solo se quita
    const id = Number(b.dataset.qg) || b.dataset.qg;
    st.cant[id] = 0; const n = $("#n" + id); if (n) n.textContent = 0;
    barra();
  });
}
function barra() {
  const [t, u] = totales();
  const e = st.paso === 2 ? envioActual() : 0;
  $("#tot").textContent = peso(t + (e || 0));
  $("#unid").textContent = `${u} alfajor${u !== 1 ? "es" : ""}` + (st.paso === 2 && st.entrega === "despacho" ? (e ? " + envío" : "") : "");
  $("#barra").hidden = st.paso >= NOMBRES.length;
  $("#sig").hidden = st.paso === 3;   // en el pago la barra solo lleva el total y "← Volver a Envío"
  if (st.paso === 3 && st.ped) { $("#tot").textContent = peso(st.ped.total); $("#unid").textContent = "Total a pagar"; }
  if (st.paso === 1) dibujarCarrito();
  const f1 = $("#falta1");
  if (f1 && st.paso === 1) {
    const r = st.cat.despacho || {}, min = Number(r.minimo || 0), falta = Math.max(0, min - t);
    f1.hidden = !(despachoActivo() && ((min > 0 && Number(r.costo || 0) > 0) || minimoPedido() > 0));
    const bajoMin = t > 0 && t < minimoPedido();
    f1.innerHTML = bajoMin ? `🚗 Pedido mínimo para envío a domicilio: <b>${peso(minimoPedido())}</b>. Te faltan <b>${peso(minimoPedido() - t)}</b>. Si prefieres, lo retiras gratis en Las Condes.`
      : st.codigo ? `🎉 Con tu código tienes <b>envío gratis</b> a tu domicilio` : t <= 0 ? `🚗 Envío gratis a tu domicilio en ${esc(listaComunas(r.comunas))} desde <b>${peso(min)}</b>`
      : falta > 0 ? `🚗 Te faltan <b>${peso(falta)}</b> para envío gratis a tu domicilio` : `🎉 ¡Tienes <b>envío gratis</b> a tu domicilio en ${esc(listaComunas(r.comunas))}!`;
    if (bajoMin) f1.innerHTML += `<div class="prog"><i style="width:${Math.min(100, Math.round(t * 100 / minimoPedido()))}%"></i></div>`;
    else if (!st.codigo) f1.innerHTML += `<div class="prog"><i style="width:${Math.min(100, Math.round(t * 100 / (min || 1)))}%"></i></div>`;
  }
  $("#atras").hidden = (st.paso !== 2 && st.paso !== 3) || (st.paso === 3 && (st.avisoMp === "pending" || st.avisoMp === "in_process"));
  $("#atras").textContent = st.paso === 3 ? "← Envío" : "← Carrito";
  $("#sig").textContent = st.paso === 1 ? "Continuar al envío →" : (st.enviando ? "Enviando…" : "Ir a pagar →");
  $("#sig").disabled = (st.paso === 1 && u <= 0 && !(st.arma && st.arma.neg + st.arma.bla > 0)) || st.enviando;   // con una caja a medio armar también se puede seguir
  guardarSesion();
}

function irA(p, desdeHistorial) {
  if (p === 1) st.ofertaVista = false;
  if (!desdeHistorial && history.state && history.state.paso !== p) history.pushState({ paso: p }, "");
  else if (!history.state) history.replaceState({ paso: p }, "");
  st.paso = p; window.scrollTo(0, 0); (p === 1 ? dibujarPaso1 : dibujarPaso2)(); barra();
}
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".ind [data-ir]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("click", (e) => {   // tocar "Carrito" o "Envío" en los pasos de arriba
  const x = e.target.closest && e.target.closest(".ind [data-ir]"); if (!x) return;
  const k = Number(x.dataset.ir);
  if (st.paso === 3) { if (st.avisoMp === "pending" || st.avisoMp === "in_process") { avisar("Tu pago está en proceso: espera la confirmación antes de cambiar el pedido."); return; } cambiarPedido(); if (k === 1) irA(1); }
  else if (st.paso === 2 && k === 1) irA(1);
});
// Botón "atrás" del celular o del navegador: se mueve entre pasos en vez de salir de la página.
window.addEventListener("popstate", (e) => {
  const destino = (e.state && e.state.paso) || 1;
  if ($("#oferta")) $("#oferta").remove();
  if ($("#pregunta")) $("#pregunta").remove();
  if (st.paso >= NOMBRES.length) { location.replace(location.pathname); return; }   // pedido terminado: empieza uno nuevo
  if (st.paso === 3) {
    if (destino >= 3) return;
    history.pushState({ paso: 3 }, "");   // se queda en el pago hasta que el cliente decida
    if (st.avisoMp === "pending" || st.avisoMp === "in_process") { avisar("Tu pago está en proceso: espera la confirmación antes de cambiar el pedido."); return; }
    preguntar("¿Quieres cambiar tu pedido?", `Tu pedido${st.ped && st.ped.codigo ? " #" + esc(st.ped.codigo) : ""} todavía no está pagado. Puedes volver a Envío, corregir lo que quieras y se actualiza el mismo pedido.`,
      [["Sí, cambiar mi pedido", "g", cambiarPedido], ["No, seguir con el pago", "sec", () => {}]]);
    return;
  }
  if (destino === 2 && (totales()[1] <= 0 || st.paso === 2)) { history.replaceState({ paso: 1 }, ""); irA(1, true); return; }   // (2→2 pasa al anular un pedido: se sigue al carrito)
  if (destino === 1 || destino === 2) irA(destino, true);
});
// Volver desde Mercado Pago con el botón atrás: el navegador puede mostrar la página congelada con el botón en "Abriendo…".
window.addEventListener("pageshow", (e) => {
  if (!e.persisted || !st.cat) return;
  const b = $("#pagomp"); if (b) { b.disabled = false; b.innerHTML = b.dataset.html || b.innerHTML; }
  if (st.paso === 3 && st.ref) volvioDeMp(st.ref, true);
});
window.addEventListener("pagehide", guardarSesion);

// Antes de pagar con envío: "agrega X y tu envío es gratis". El cliente elige y sigue directo al pago.
// Ventana "agrega alfajores": botones para sumar lo que falta con un toque, más otras salidas.
// cfg: { icono, titulo, texto, falta, listo, salidas: [[texto, clase, accion]] }
function ofrecerAgregar(cfg) {
  const neg = alfajores().find((p) => p.id === negroId()), bla = alfajores().find((p) => p.id === blancoId());
  const precio = Math.max((neg || {}).precio || 0, (bla || {}).precio || 0) || 1;
  const n = Math.max(1, Math.ceil(cfg.falta / precio));
  const extra = (a, b) => a * ((neg || {}).precio || precio) + b * ((bla || {}).precio || precio);
  const mitad = [Math.ceil(n / 2), Math.floor(n / 2)];
  const opciones = [neg && ["neg", `Agregar ${n} negro${n > 1 ? "s" : ""}`, n, 0], bla && ["bla", `Agregar ${n} blanco${n > 1 ? "s" : ""}`, 0, n],
    neg && bla && n > 1 && ["mix", `Agregar ${mitad[0]} negro${mitad[0] > 1 ? "s" : ""} y ${mitad[1]} blanco${mitad[1] > 1 ? "s" : ""}`, mitad[0], mitad[1]]].filter(Boolean);
  const fondo = document.createElement("div");
  fondo.id = "oferta";
  fondo.style.cssText = "position:fixed;inset:0;z-index:50;background:rgba(42,26,18,.45);display:flex;align-items:flex-end;justify-content:center";
  fondo.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="oftit" style="background:var(--sup);width:100%;max-width:520px;max-height:90vh;overflow:auto;box-sizing:border-box;border-radius:20px 20px 0 0;padding:22px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)">
    <div style="font-size:30px;line-height:1">${cfg.icono}</div>
    <h2 class="tit" id="oftit" style="margin-top:6px">${cfg.titulo}</h2>
    <div class="mut sm">${cfg.texto.replace("{n}", `${n} alfajor${n > 1 ? "es" : ""}`)}</div>
    ${opciones.map((o) => `<button class="btn g" data-o="${o[0]}" style="margin-top:10px;width:100%;justify-content:space-between;display:flex;align-items:center;padding:0 16px"><span>${o[1]}</span><span style="font-weight:400">+${peso(extra(o[2], o[3]))}</span></button>`).join("")}
    ${cfg.salidas.map((x, i) => `<button class="btn ${x[1]}" data-s="${i}"${x[3] ? ` id="${x[3]}"` : ""} style="margin-top:10px;width:100%">${x[0]}</button>`).join("")}</div>`;
  document.body.appendChild(fondo);
  const esc2 = (e) => { if (e.key === "Escape") { cerrar(); if (cfg.alCerrar) cfg.alCerrar(); } };
  const cerrar = () => { fondo.remove(); document.removeEventListener("keydown", esc2); };
  document.addEventListener("keydown", esc2);
  fondo.onclick = (ev) => { if (ev.target === fondo) { cerrar(); if (cfg.alCerrar) cfg.alCerrar(); } };   // tocar afuera: vuelve al formulario sin pagar
  fondo.querySelectorAll("button[data-s]").forEach((b) => b.onclick = () => { cerrar(); cfg.salidas[Number(b.dataset.s)][2](); });
  fondo.querySelectorAll("button[data-o]").forEach((b) => b.onclick = () => {
    const o = opciones.find((x) => x[0] === b.dataset.o);
    if (o[2]) st.cant[negroId()] = (st.cant[negroId()] || 0) + o[2];
    if (o[3]) st.cant[blancoId()] = (st.cant[blancoId()] || 0) + o[3];
    cerrar(); avisar(cfg.listo); if (st.paso === 2) dibujarPaso2(); barra(); enviar();
  });
}
function ofrecerEnvioGratis() {
  st.ofertaVista = true;
  const r = st.cat.despacho, costo = Number(r.costo || 0);
  ofrecerAgregar({ icono: "🚗", titulo: "¡Unos alfajores más y tienes envío gratis!", texto: `Con {n} más te ahorras los <b>${peso(costo)}</b> del envío.`,
    falta: Number(r.minimo || 0) - totales()[0], listo: "¡Listo! Tu envío ahora es gratis 🎉", alCerrar: () => { st.ofertaVista = false; },
    salidas: [["🛒 Ir al carrito para elegir", "out", () => irA(1), "ofcarro"],
              [`No, gracias. Pagar con envío (${peso(costo)})`, "sec", () => enviar(), "ofno"]] });
}
// Tus comunas, bajo el pedido mínimo: agregar ahí mismo o ir al carrito.
function ofrecerMinimoZona() {
  st.ofertaVista = true;   // ya se le ofreció agregar: no se le encadena otra ventana de envío gratis
  const falta = minimoPedido() - totales()[0];
  ofrecerAgregar({ icono: "🛍️", titulo: `Te faltan ${peso(falta)} para el pedido mínimo`, texto: `El envío a domicilio es para pedidos desde ${peso(minimoPedido())}. Agrega {n} y seguimos.`,
    falta, listo: "¡Listo! Ya llegas al mínimo 🎉", salidas: [["🛒 Ir al carrito para elegir", "out", () => irA(1), "minCarro"],
      ["📍 Mejor lo retiro gratis en Las Condes", "sec", () => { st.retiroZona = true; dibujarPaso2(); barra(); avisar("Cambiamos a retiro gratis. Revisa y toca «Ir a pagar»."); }, "minRetiro"]] });
}
// Otra comuna con envío bajo el mínimo: agregar alfajores ahí mismo, ir al carrito o cambiar a retiro gratis.
function ofrecerMinimoOtras() {
  const falta = minimoOtras() - totales()[0];
  ofrecerAgregar({ icono: "📦", titulo: `Te faltan ${peso(falta)} para el envío`, texto: `El envío a otras comunas es desde ${peso(minimoOtras())}. Agrega {n} y seguimos al pago.`,
    falta, listo: "¡Listo! Ya llegas al mínimo 🎉",
    salidas: [["🛒 Ir al carrito para elegir", "out", () => irA(1)],
              ["📍 Mejor retiro gratis en Las Condes", "sec", () => { st.modoOtra = "retiro"; dibujarPaso2(); barra(); avisar("Cambiamos a retiro gratis. Revisa y toca «Ir a pagar»."); }]] });
}

async function enviar() {
  if (st.enviando || $("#oferta") || $("#pregunta")) return;   // doble toque o ventana abierta
  if (st.paso === 2) leerCampos();
  const tel = (st.tel || "").replace(/\D/g, "");
  if (tel.length !== 8) { avisar("Escribe los 8 números de tu celular, los que van después del +569."); return; }
  if ((st.nombre || "").trim().length < 2) { avisar("Escribe tu nombre."); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test((st.correo || "").trim())) { avisar("Escribe un correo válido, por ejemplo nombre@gmail.com."); return; }
  st.entrega = modoEntrega();
  const fg = 0;   // el retiro ya no tiene mínimo (es la opción para pedidos chicos)
  if (fg) { avisar(`Para retiro, el mínimo es de ${st.cat.minimo_granel || 4} alfajores. Agrega ${fg} más.`); return; }
  if (!agendaActiva() && st.programar && !esOtra() && modoEntrega() === "despacho") {
    const f = st.fechaProg, min = sumarHabiles(hoyLocal(), 2), max = sumarDiasLocal(hoyLocal(), 60);
    if (!f) { avisar("Elige el día para programar tu pedido, o marca «Lo antes posible»."); return; }
    if (f < min || f > max) { avisar(`Puedes programar desde el ${fechaLarga(min)}.`); return; }
    if (!esHabil(f)) { avisar("Entregamos de lunes a viernes (sin feriados). Elige otro día."); return; }
  }
  if (agendaActiva()) {
    if (!diasPosibles().length) { avisar("Ya no quedan días disponibles para este pedido. Escríbenos por WhatsApp."); return; }
    if (!st.fecha) { avisar("Elige el día de entrega."); return; }
  }
  if (despachoActivo()) {
    if (!st.comuna) { avisar("Elige tu comuna para el despacho."); return; }
    if (esOtra() && (st.otra || "").trim().length < 3) { avisar("Escribe en qué comuna estás."); const o = $("#otra"); if (o) o.focus(); return; }
    if (esOtra() && !st.entrega) { avisar("Elige retiro gratis en Las Condes o envío a domicilio."); return; }
    if (esOtra() && st.entrega === "despacho" && totales()[0] < minimoOtras()) { if (negroId() || blancoId()) ofrecerMinimoOtras(); else avisar(`Para envío a otras comunas el pedido mínimo es ${peso(minimoOtras())}.`); return; }
    if (st.entrega === "despacho" && (st.direccion || "").trim().length < 5) { avisar("Escribe tu dirección para el despacho."); const d = $("#dir"); if (d) d.focus(); return; }
    if (!esOtra() && st.entrega === "despacho" && totales()[0] < minimoPedido()) { if (negroId() || blancoId()) ofrecerMinimoZona(); else avisar(`El pedido mínimo para envío es ${peso(minimoPedido())}.`); return; }
    if (!st.ofertaVista && !esOtra() && envioActual() > 0 && negroId()) { ofrecerEnvioGratis(); return; }   // le falta poco para el envío gratis: se le ofrece una vez
  }
  st.enviando = true; barra();
  try {
    const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ accion: "pedido", ref: st.ref, editar: !!st.editando, nombre: st.nombre, telefono: tel, correo: (st.correo || "").trim(), nota: st.cajas.length ? "#C " + st.cajas.map((k) => `${k.cajaId}=${negroId()}:${k.neg},${blancoId()}:${k.bla}`).join(";") : "", cantidades: st.cant,
        esperado: (st.totalEsperado = totales()[0] + (envioActual() || 0)),
        fecha_entrega: agendaActiva() ? st.fecha : (st.programar && !esOtra() && st.entrega === "despacho" ? st.fechaProg : ""), codigo: st.codigo || "",
        entrega: despachoActivo() ? st.entrega : "retiro", comuna: comunaElegida(), otra_comuna: esOtra(), direccion: st.entrega !== "despacho" ? "" : [st.direccion || "", (st.depto || "").trim()].filter(Boolean).join(", "), trampa: ($("#trampa") || {}).value || "" }) });
    const d = await r.json();
    st.enviando = false;
    if (!d.ok && d.nuevo && st.editando) { st.editando = false; st.ref = nuevoRef(); barra(); return enviar(); }   // el anterior ya no estaba activo: va como pedido nuevo
    if (!d.ok) {
      avisar(d.error || "No pudimos guardar tu pedido. Intenta de nuevo."); barra();
      if (st.codigo && /código/i.test(d.error || "")) {   // el código dejó de valer: se ofrece seguir sin él
        preguntar("Tu código ya no es válido", "Puedes seguir con el precio normal o escribirnos por WhatsApp.",
          [["Seguir sin código", "g", async () => { await recargarPrecios(); st.codigo = ""; dibujarPaso2(); barra(); }], ["Volver", "sec", () => {}]]);
      }
      if (agendaActiva() && /día/.test(d.error || "")) {   // otro cliente tomó el cupo: se vuelven a pedir los días
        try { const c2 = await (await fetch(window.API_URL)).json(); if (c2.ok) { st.cat.agenda = c2.agenda; st.fecha = ""; dibujarPaso2(); } } catch (e) {}
      }
      return;
    }
    try { localStorage.setItem("av_cliente", JSON.stringify({ nombre: st.nombre, tel: st.tel, correo: st.correo, comuna: st.comuna, otra: st.otra, direccion: st.direccion, depto: st.depto })); } catch (e) {}   // la próxima vez se rellena solo
    if (st.editando) avisar("✓ Pedido actualizado");
    st.editando = false;
    history.pushState({ paso: 3 }, "");
    st.paso = 3; st.avisoMp = ""; window.scrollTo(0, 0); barra(); dibujarPaso3(d.pedido, d.pago || {});
  } catch (e) {
    st.enviando = false; barra();
    avisar("Sin conexión. Revisa tu internet e intenta de nuevo.");
  }
}

$("#atras").onclick = () => { if (st.paso === 3) cambiarPedido(); else irA(1); };
function faltaGranel() { const min = st.cat.minimo_granel || 4, n = alfajores().reduce((a, p) => a + (st.cant[p.id] || 0), 0);
  return !st.cajas.length && n > 0 && n < min ? min - n : 0; }
$("#tot").style.cursor = "pointer";
$("#tot").onclick = () => { if (st.paso !== 1) return; const c = $("#carrito"); if (c && !c.hidden) c.scrollIntoView({ behavior: "smooth", block: "center" }); };
$("#sig").onclick = () => {
  if (st.paso !== 1) { enviar(); return; }
  if (st.arma && st.arma.neg + st.arma.bla > 0) {   // armó una caja pero no tocó "Agregar caja"
    const c = cajasCat().find((p) => p.navidad === st.arma.tam), falta = st.arma.tam - st.arma.neg - st.arma.bla;
    if (falta === 0 && c) {
      st.cajas.push({ tam: st.arma.tam, neg: st.arma.neg, bla: st.arma.bla, cajaId: c.id }); st.cant[c.id] = (st.cant[c.id] || 0) + 1; st.arma = null;
      avisar("Agregamos tu caja al pedido 🎁");
    } else {
      preguntar("Tu caja no está completa", `A la caja de ${st.arma.tam} le ${falta > 0 ? `faltan ${falta} alfajor${falta > 1 ? "es" : ""}` : `sobran ${-falta}`}. ¿Qué quieres hacer?`,
        [["Completar la caja", "g", () => { const n = $("#navidad"); if (n) n.scrollIntoView({ behavior: "smooth", block: "center" }); }],
         ["Seguir sin esa caja", "sec", () => { st.arma = null; dibujarPaso1(); barra(); if (totales()[1] > 0) irA(2); }]]);
      return;
    }
  }
  if (totales()[1] > 0) irA(2);
};

async function irAPagarMp(ref, boton) {
  if (boton && boton.disabled) return;
  const html = boton ? (boton.dataset.html || boton.innerHTML) : "";
  if (boton) { boton.dataset.html = html; boton.disabled = true; boton.textContent = "Abriendo Mercado Pago…"; }
  try {
    const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ accion: "mp_link", ref: ref, volver: location.origin + location.pathname }) });
    const d = await r.json();
    if (d.ok && d.pagado) { pantallaFinal(st.ped, "pagado"); return; }
    if (d.ok && d.url) { guardarSesion(); location.href = d.url; setTimeout(() => { if (boton) { boton.disabled = false; boton.innerHTML = html; } }, 8000); return; }
    avisar(d.error || "No pudimos abrir el pago con tarjeta. Transfiere, por favor.");
  } catch (e) { avisar("Sin conexión. Revisa tu internet e intenta de nuevo."); }
  if (boton) { boton.disabled = false; boton.innerHTML = html; }
}

// El cliente vuelve desde Mercado Pago a ?ref=...&mp=1: se pregunta al script si el pago quedó aprobado.
async function volvioDeMp(ref, silencioso) {
  $("#barra").hidden = true; $("#sub").hidden = true;
  if (!silencioso) $("#cuerpo").innerHTML = indicador() + `<div class="card"><b>Revisando tu pago…</b><div class="mut sm" style="margin-top:6px">Un momento 🙏</div></div>`;
  let d = {};
  for (let i = 0; i < (silencioso ? 1 : 4); i++) {
    try { const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ accion: "estado_mp", ref: ref }) }); d = await r.json(); } catch (e) { d = {}; }
    if (d.pagado) break;
    await new Promise((ok) => setTimeout(ok, 2500));
  }
  let v = {};
  try { v = await api({ accion: "ver_pedido", ref: ref }); } catch (e) {}
  if (d.pagado || v.pagado) { pantallaFinal(v.ok ? v.pedido : st.ped, "pagado"); return; }
  // No se pagó (canceló, rechazado o en proceso): vuelve al paso de pago con TODAS las opciones, sin quedar atrapado.
  st.avisoMp = d.estado === "rejected" ? "rejected" : (d.estado === "pending" || d.estado === "in_process") ? d.estado : "cancelado";
  if (silencioso && st.avisoMp === "cancelado" && st.paso === 3 && st.ped) { dibujarPaso3(st.ped, st.pago || {}); return; }
  mostrarPedido(ref, v);
}

// Link "Pagar mi pedido" del correo: vuelve al paso de pago de ese pedido.
async function pagarDespues(ref) {
  $("#barra").hidden = true; $("#sub").hidden = true;
  $("#cuerpo").innerHTML = `<div class="card"><b>Buscando tu pedido…</b></div>`;
  let d = {};
  try { d = await api({ accion: "ver_pedido", ref: ref }); } catch (e) { d = { ok: false, error: "Sin conexión. Revisa tu internet.", red: true }; }
  mostrarPedido(ref, d);
}
// Decide qué ver de un pedido ya hecho: pagado, comprobante enviado, vencido, anulado o pendiente de pago.
function mostrarPedido(ref, d) {
  const c = st.cat || {};
  const wa = c.whatsapp ? `<a class="btn out" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent("Hola! Tengo una consulta sobre mi pedido.")}">💬 Escríbenos por WhatsApp</a>` : "";
  if (!d.ok) {
    guardarPendiente(""); $("#barra").hidden = true;
    $("#cuerpo").innerHTML = `<div class="card"><b>${esc(d.error || "No pudimos cargar tu pedido.")}</b><div class="mut sm" style="margin-top:6px">${d.red ? "Intenta de nuevo en un momento." : "Escríbenos por WhatsApp y te ayudamos."}</div>
      ${d.red ? `<button class="btn g" id="reintentar" style="margin-top:12px">Intentar de nuevo</button>` : ""}<a class="btn ${d.red ? "sec" : "g"}" style="margin-top:12px" href="${location.pathname}">Hacer un pedido nuevo</a>${wa}</div>`;
    const ri = $("#reintentar"); if (ri) ri.onclick = () => pagarDespues(ref);
    return;
  }
  st.ref = ref;
  if (d.pagado || d.comprobante) { pantallaFinal(d.pedido, d.pagado ? "pagado" : "comp"); return; }
  if (d.vencido) {   // pasaron más de 3 horas sin pago: se ofrece volver a armarlo tal cual
    guardarPendiente(""); $("#barra").hidden = true;
    $("#cuerpo").innerHTML = `<div class="card"><b>La reserva de este pedido venció ⏳</b>
      <div class="mut sm" style="margin-top:6px">Reservamos los pedidos por 2 horas mientras llega el pago. Puedes volver a hacerlo en un toque, con los mismos productos y datos.</div>
      <button class="btn g" id="rearmar" style="margin-top:12px">Volver a hacer este pedido</button>${wa}</div>`;
    $("#rearmar").onclick = () => { st.ped = d.pedido; cargarDesdePedido(d.pedido); st.ref = nuevoRef(); api({ accion: "anular", ref: ref }).catch(() => {});
      history.replaceState({ paso: 2 }, "", location.pathname); st.paso = 2; dibujarPaso2(); barra(); };
    return;
  }
  st.desdeCorreo = true; st.nombre = st.nombre || d.pedido.nombre; st.paso = 3; barra(); dibujarPaso3(d.pedido, d.pago || {});
}

async function iniciar() {
  const sub = $("#sub");
  if (!window.API_URL) { sub.textContent = "Esta página aún no está conectada."; return; }
  try {
    const r = await fetch(window.API_URL); const c = await r.json();
    if (!c.ok) throw new Error();
    st.cat = c;
    const q = new URLSearchParams(location.search);
    const ses = leerSesion();
    if (ses && ses.cant) {   // recargó la página o volvió atrás: se recupera el carrito y los datos
      const ids = {}; c.productos.forEach((p) => ids[p.id] = true);
      CAMPOS_SESION.forEach((k) => { if (ses[k] !== undefined && ses[k] !== null) st[k] = ses[k]; });
      Object.keys(st.cant).forEach((k) => { if (!ids[k]) delete st.cant[k]; });
      st.cajas = (st.cajas || []).filter((k) => ids[k.cajaId]);
      if (st.codigo) await aplicarCodigo(st.codigo, true);
    }
    history.replaceState({ paso: 1 }, "");
    if (q.get("mp") && q.get("ref")) { volvioDeMp(q.get("ref").replace(/[^a-zA-Z0-9-]/g, "")); return; }
    if (q.get("pagar")) { pagarDespues(q.get("pagar").replace(/[^a-zA-Z0-9-]/g, "")); return; }
    if (ses && ses.paso === 3 && ses.ref) { pagarDespues(ses.ref); return; }
    if (!c.activo) {
      sub.textContent = "Pedidos de alfajores";
      $("#cuerpo").innerHTML = `<div class="card"><b>Por ahora no estamos tomando pedidos 🙏</b><div class="mut sm" style="margin-top:6px">Escríbenos por Instagram @alfajores_vicencio y te ayudamos.</div></div>`;
      return;
    }
    sub.textContent = ""; sub.hidden = true;
    try { const g = JSON.parse(localStorage.getItem("av_cliente") || "null"); if (g) ["nombre", "tel", "correo", "comuna", "otra", "direccion", "depto"].forEach((k) => { if (g[k] && !st[k]) st[k] = g[k]; }); } catch (e) {}
    if (ses && ses.paso === 2 && totales()[1] > 0) { history.replaceState({ paso: 1 }, ""); irA(2); } else irA(1);
    const pend = leerPendiente();
    if (pend) {   // volvió atrás desde Mercado Pago o cerró la página: se ofrece retomar el pago
      try {
        const v = await (await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ accion: "ver_pedido", ref: pend }) })).json();
        if (!v.ok || v.pagado || v.comprobante) { guardarPendiente(""); return; }
        st.pendiente = { ref: pend, pedido: v.pedido };
        if (st.paso === 1) dibujarPaso1();
      } catch (e) {}
    }
  } catch (e) {
    sub.hidden = false; sub.innerHTML = `No pudimos cargar la página. Revisa tu conexión.<br><button class="btn g" style="margin-top:12px;width:auto;padding:0 20px" onclick="location.reload()">Intentar de nuevo</button>`;
  }
}
iniciar();
</script>
</body>
</html>
