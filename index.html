<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE6">
<title>Pedidos · Alfajores Vicencio</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Pagella;src:url(pagella.otf)}
:root{--bg:#F3EEE6;--sup:#FBF8F3;--bor:#E0D4C4;--bor2:#D3C4B1;--hov:#EBE2D5;--fg:#2A1A12;--mut:#6B4A35;--pri:#BC7B69;--pri-t:#8F5444;--ok:#3E5A3A;--serif:'Pagella','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 140px;display:flex;flex-direction:column;gap:12px}
.logo{display:block;width:min(290px,78vw);margin:0 auto}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:0}
.card{background:var(--sup);border:1px solid var(--bor);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(42,26,18,.06)}
.tit{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.2;margin:0 0 2px}
.mut{color:var(--mut)}.xs{font-size:12px}.sm{font-size:14px}
.ind{display:flex;align-items:flex-start;margin:4px 0 2px}
.ind .p{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font-size:11px;color:var(--mut);text-align:center;line-height:1.15}
.ind .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--hov);color:var(--mut);border:1px solid var(--bor2)}
.ind .act .n{background:var(--pri);color:var(--fg);border-color:var(--pri)}.ind .act{color:var(--fg);font-weight:600}
.ind .ok .n{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ind .l{flex:1;height:2px;background:var(--bor2);margin-top:15px}.ind .l.ok{background:var(--fg)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod{padding:8px 0}
.cant{display:flex;align-items:center;gap:4px}
.cant button{width:48px;height:48px;border-radius:50%;border:1px solid var(--bor);background:transparent;color:var(--pri-t);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation}
.cant button.mas{background:var(--pri);border-color:var(--pri);color:var(--fg)}
.cant .num{font-size:22px;font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
label.c{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sup);border:1px solid var(--bor2);border-radius:6px;padding:15px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.tel{display:flex;gap:8px}
.pref{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border:1px solid var(--bor2);border-radius:6px;background:var(--hov);font-weight:600;flex-shrink:0}
.pref svg{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.trampa{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--bor);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.barra .in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.barra .tot{font-size:20px;font-weight:700;line-height:1.1}
.btn{height:52px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:600;background:var(--pri);color:var(--fg);padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.g{flex:1}.btn.sec{background:transparent;color:var(--pri-t);padding:0 14px}
.btn.out{background:transparent;border:1px solid var(--pri);color:var(--pri-t);width:100%;height:46px;border-radius:12px;font-size:15px}
.btn.wa{background:#2E7D4F;color:#fff;width:100%}
.btn.cp{background:var(--pri);width:100%;height:46px;border-radius:12px;font-size:15px;margin:6px 0 4px}
.mini{width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.dato{display:flex;align-items:center;justify-content:space-between;padding:4px 0;gap:8px}
.dato b{font-weight:500;font-size:16px;word-break:break-all}
.dato button{background:none;border:0;color:var(--pri-t);font-size:13px;font-weight:600;cursor:pointer;padding:8px}
hr{border:0;border-top:1px solid var(--bor);margin:8px 0}
.aviso{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;display:none}
[hidden]{display:none!important}
.opc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bor2);border-radius:12px;padding:12px;margin-top:8px;cursor:pointer}
.opc.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#F6EDE6}
.opc input{width:20px;height:20px;margin:2px 0 0;flex-shrink:0;accent-color:var(--pri-t);padding:0}
select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sup);border:1px solid var(--bor2);border-radius:6px;padding:15px 14px;outline:none;-webkit-appearance:none;appearance:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <img class="logo" src="logo.svg" alt="Vicencio · alfajores artesanales">
  <p class="sub" id="sub">Cargando…</p>
  <div id="cuerpo"></div>
</div>
<div class="barra" id="barra" hidden>
  <div class="in">
    <div><div class="mut xs" id="unid">0 alfajores</div><div class="tot" id="tot">$0</div></div>
    <div style="display:flex;gap:8px;flex:1;justify-content:flex-end">
      <button class="btn sec" id="atras" hidden>← Atrás</button>
      <button class="btn g" id="sig" disabled>Continuar →</button>
    </div>
  </div>
</div>
<div class="aviso" id="aviso"></div>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const peso = (n) => "$" + Math.round(n).toLocaleString("es-CL");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BANDERA = '<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#fff"/><rect y="30" width="90" height="30" fill="#D52B1E"/><rect width="30" height="30" fill="#0039A6"/><polygon points="15,5 17.5,11.6 24.5,11.9 19,16.3 20.9,23.1 15,19.2 9.1,23.1 11,16.3 5.5,11.9 12.5,11.6" fill="#fff"/></svg>';
const NOMBRES = ["Elige", "Tus datos", "Pago y envío"];
const st = { paso: 1, cat: null, cant: {}, entrega: "retiro", comuna: "", otra: "", direccion: "", ref: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)), enviando: false };

function avisar(t) { const a = $("#aviso"); a.textContent = t; a.style.display = "block"; clearTimeout(avisar.t); avisar.t = setTimeout(() => a.style.display = "none", 3200); }
function sabor(n) { return String(n).trim().toLowerCase().replace(/^alfajor(es)?\s+(de\s+)?/, ""); }
function frase(ls) {
  const p = ls.map((l) => { let r = String(l.nombre).trim().toLowerCase().replace(/^alfajor(es)?\s*/, "");
    if (l.cantidad !== 1 && !r.startsWith("de ") && r && !r.endsWith("s")) r += "s";
    return `${l.cantidad} alfajor${l.cantidad !== 1 ? "es" : ""} ${r}`.trim(); });
  return p.length === 1 ? p[0] : p.slice(0, -1).join(", ") + " y " + p[p.length - 1];
}
function waNum(d) { d = String(d).replace(/\D/g, ""); return d.length === 9 ? "56" + d : d; }
function lineasActuales() { return st.cat.productos.filter((p) => st.cant[p.id] > 0).map((p) => ({ producto_id: p.id, nombre: p.nombre, cantidad: st.cant[p.id], precio: p.precio })); }
const OTRA = "__otra";
function despachoActivo() { return !!(st.cat && st.cat.despacho && st.cat.despacho.activo); }
function comunaElegida() { return st.comuna === OTRA ? (st.otra || "").trim() : st.comuna; }
function envioActual() {   // misma regla que el servidor; null = por coordinar
  if (st.entrega !== "despacho" || !despachoActivo()) return 0;
  const r = st.cat.despacho, sub = totales()[0];
  if (st.comuna === OTRA) return null;
  if ((r.comunas || []).indexOf(st.comuna) < 0) return 0;
  return sub >= Number(r.minimo || 0) ? 0 : Number(r.costo || 0);
}
function faltaGratis() {   // cuánto falta para el envío gratis (0 si no aplica)
  if (st.entrega !== "despacho" || !despachoActivo() || st.comuna === OTRA) return 0;
  const r = st.cat.despacho;
  if ((r.comunas || []).indexOf(st.comuna) < 0 || !Number(r.costo || 0)) return 0;
  return Math.max(0, Number(r.minimo || 0) - totales()[0]);
}
function totales() { let t = 0, u = 0; st.cat.productos.forEach((p) => { t += (st.cant[p.id] || 0) * p.precio; u += st.cant[p.id] || 0; }); return [t, u]; }

function indicador() {
  let h = "";
  NOMBRES.forEach((n, i) => { const k = i + 1, c = k === st.paso ? "act" : k < st.paso ? "ok" : "";
    h += `<div class="p ${c}"><div class="n">${k < st.paso ? "✓" : k}</div>${n}</div>`;
    if (k < NOMBRES.length) h += `<div class="l ${k < st.paso ? "ok" : ""}"></div>`; });
  return `<div class="ind">${h}</div>`;
}

function dibujarPaso1() {
  const c = st.cat;
  $("#cuerpo").innerHTML = indicador() + `
  <div class="card"><h2 class="tit">Paso 1 · Elige tus alfajores</h2><div class="mut xs">Toca + para sumar los que quieras.</div>
    ${c.productos.map((p) => `<div class="fila prod"><div><div style="font-weight:500;font-size:16px">${/negro/i.test(p.nombre) ? "⚫" : "⚪"} ${esc(p.nombre)}</div><div class="mut sm">${peso(p.precio)} c/u</div></div>
      <div class="cant"><button data-id="${p.id}" data-d="-1" aria-label="Quitar">−</button><span class="num" id="n${p.id}">${st.cant[p.id] || 0}</span><button class="mas" data-id="${p.id}" data-d="1" aria-label="Sumar">+</button></div></div>`).join("")}
  </div>
  <div class="card sm" id="falta1" style="margin-top:12px;border-color:var(--pri);background:#F6EDE6" hidden></div>
  ${c.entrega ? `<div class="card sm" style="margin-top:12px">🚚 ${esc(c.entrega)}</div>` : ""}
  ${c.whatsapp ? `<a class="btn out" style="margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent("Hola! Tengo una consulta sobre los alfajores.")}">💬 ¿Tienes alguna duda? Escríbenos</a>` : ""}`;
  document.querySelectorAll(".cant button").forEach((b) => b.onclick = () => { const id = b.dataset.id; st.cant[id] = Math.max(0, Math.min(100, (st.cant[id] || 0) + Number(b.dataset.d))); $("#n" + id).textContent = st.cant[id]; barra(); });
}

function dibujarPaso2() {
  const [t] = totales();
  $("#cuerpo").innerHTML = indicador() + `
  <div class="card"><h2 class="tit">Paso 2 · Tus datos</h2>
    <div class="mut sm">Tu pedido: ${esc(frase(lineasActuales()))} · ${peso(t)}</div>
    <label class="c" for="nombre">Tu nombre</label><input id="nombre" autocomplete="name" value="${esc(st.nombre || "")}">
    <label class="c" for="tel">Tu WhatsApp</label>
    <div class="tel"><div class="pref">${BANDERA}<span>+569</span></div><input id="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="1234 5678" value="${esc(st.tel || "")}"></div>
    <div class="xs mut" id="ayuda" style="margin-top:4px">Escribe solo los 8 números que siguen al +569</div>
    <label class="c" for="nota">Comentario (opcional)</label><textarea id="nota" rows="2" placeholder="Ej: hora que te acomoda o dónde nos juntamos">${esc(st.nota || "")}</textarea>
    <input class="trampa" id="trampa" tabindex="-1" autocomplete="off" aria-hidden="true">
  </div>
  ${despachoActivo() ? `<div class="card" style="margin-top:12px"><div style="font-weight:600;font-size:16px">¿Cómo lo recibes?</div>
    <label class="opc ${st.entrega === "retiro" ? "sel" : ""}" id="o_retiro"><input type="radio" name="ent" value="retiro" ${st.entrega === "retiro" ? "checked" : ""}>
      <div><div style="font-weight:500">🚇 Retiro</div><div class="mut sm">${esc(st.cat.entrega || "Coordinamos el lugar")}</div></div></label>
    <label class="opc ${st.entrega === "despacho" ? "sel" : ""}" id="o_despacho"><input type="radio" name="ent" value="despacho" ${st.entrega === "despacho" ? "checked" : ""}>
      <div><div style="font-weight:500">🚗 Despacho a domicilio</div><div class="mut sm">Con previa coordinación</div></div></label>
    <div id="desp" ${st.entrega === "despacho" ? "" : "hidden"}>
      <label class="c" for="comuna">Comuna</label>
      <select id="comuna"><option value="">Elige tu comuna</option>${(st.cat.despacho.comunas || []).map((x) => `<option ${st.comuna === x ? "selected" : ""}>${esc(x)}</option>`).join("")}<option value="${OTRA}" ${st.comuna === OTRA ? "selected" : ""}>Otra comuna</option></select>
      <input id="otra" placeholder="¿Cuál comuna?" style="margin-top:8px" value="${esc(st.otra)}" ${st.comuna === OTRA ? "" : "hidden"}>
      <label class="c" for="dir">Dirección</label><input id="dir" autocomplete="street-address" placeholder="Calle, número y depto" value="${esc(st.direccion)}">
      <div class="sm" id="envtxt" style="margin-top:8px"></div>
    </div></div>` : ""}`;
  if (despachoActivo()) {
    const info = () => {
      const e = envioActual(), r = st.cat.despacho, t = $("#envtxt");
      if (!st.comuna) t.textContent = "";
      else if (e === null) t.textContent = "El costo del envío lo coordinamos por WhatsApp.";
      else if (e === 0) t.textContent = "Envío sin costo.";
      else t.innerHTML = `Envío ${peso(e)}. <b>Te faltan ${peso(faltaGratis())} para tu envío gratis.</b> <a href="#" id="sumar" style="color:var(--pri-t);font-weight:600">+ Agregar alfajores</a>`;
      const a = $("#sumar"); if (a) a.onclick = (ev) => { ev.preventDefault(); irA(1); };
      barra();
    };
    document.querySelectorAll('input[name="ent"]').forEach((r) => r.onchange = () => {
      st.entrega = r.value; $("#desp").hidden = st.entrega !== "despacho";
      $("#o_retiro").classList.toggle("sel", st.entrega === "retiro"); $("#o_despacho").classList.toggle("sel", st.entrega === "despacho"); info(); });
    $("#comuna").onchange = (e) => { st.comuna = e.target.value; $("#otra").hidden = st.comuna !== OTRA; info(); };
    $("#otra").oninput = (e) => st.otra = e.target.value;
    $("#dir").oninput = (e) => st.direccion = e.target.value;
    info();
  }
  const tel = $("#tel");
  function limpiar(v) { let d = String(v).replace(/\D/g, ""); if (d.length > 8) { d = d.replace(/^0+/, ""); if (d.length > 8 && d.startsWith("56")) d = d.slice(2); if (d.length > 8 && d.startsWith("9")) d = d.slice(1); } return d.slice(0, 8); }
  function ayuda() { const f = 8 - tel.value.length, a = $("#ayuda");
    if (f === 0) { a.textContent = "✓ Número completo"; a.style.color = "var(--ok)"; a.style.fontWeight = 600; }
    else { a.textContent = `Faltan ${f} número${f !== 1 ? "s" : ""} (son 8 después del +569)`; a.style.color = ""; a.style.fontWeight = 400; } }
  tel.addEventListener("input", () => { tel.value = limpiar(tel.value); st.tel = tel.value; ayuda(); });
  tel.addEventListener("paste", (e) => { e.preventDefault(); tel.value = limpiar((e.clipboardData || window.clipboardData).getData("text")); st.tel = tel.value; ayuda(); });
  $("#nombre").oninput = (e) => st.nombre = e.target.value;
  $("#nota").oninput = (e) => st.nota = e.target.value;
  ayuda();
}

function copiar(t, msg) {
  const ok = () => avisar(msg || "Copiado ✅");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => fallback());
  else fallback();
  function fallback() { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (e) { avisar("No pude copiar, hazlo a mano."); } a.remove(); }
}

function dibujarPaso3(ped, pago) {
  const c = st.cat;
  const rut = (r) => { const l = String(r || "").replace(/[^0-9kK]/g, ""); return l.length < 8 ? String(r || "").trim() : Number(l.slice(0, -1)).toLocaleString("es-CL") + "-" + l.slice(-1).toUpperCase(); };
  const filas = [["Nombre", pago.titular], ["RUT", rut(pago.rut)], ["Banco", pago.banco], ["Tipo de cuenta", pago.tipo], ["N° de cuenta", pago.numero], ["Correo", pago.correo]].filter((f) => f[1]);
  const desp = (ped.entrega || st.entrega) === "despacho";
  const comuna = ped.comuna || comunaElegida(), dir = ped.direccion || st.direccion;
  const envio = Number(ped.envio || 0), coordinar = desp && st.comuna === OTRA;
  const texto = `Hola! Hice un pedido de ${frase(ped.lineas)} por ${peso(ped.total)}${desp ? ` con despacho a ${comuna}` : ""}. Adjunto el comprobante de transferencia.`;
  $("#cuerpo").innerHTML = indicador() + `
  <div class="card"><h2 class="tit">Paso 3 · Paga y envíanos el comprobante</h2><div class="mut sm">¡Gracias! Tu pedido quedó anotado. Solo faltan 3 cosas:</div></div>
  <div class="card" style="margin-top:12px"><div style="font-weight:600;font-size:16px;margin-bottom:6px">Resumen de tu pedido</div>
    ${ped.lineas.map((l) => `<div class="fila sm"><span>${l.cantidad} × ${esc(l.nombre)}</span><span>${peso(l.cantidad * l.precio)}</span></div>`).join("")}
    ${desp ? `<div class="fila sm"><span>🚗 Envío a ${esc(comuna)}</span><span>${coordinar ? "por coordinar" : envio ? peso(envio) : "sin costo"}</span></div>` : ""}
    <hr><div class="fila"><span style="font-weight:600;font-size:16px">Total a transferir</span><span style="font-weight:700;font-size:20px">${peso(ped.total)}</span></div></div>
  <div class="card" style="margin-top:12px"><div class="fila" style="justify-content:flex-start"><span class="mini">1</span><b style="font-size:16px">Transfiere ${peso(ped.total)}</b></div>
    ${filas.length ? `<button class="btn cp" id="cptodo">Copiar todos los datos</button>` + filas.map((f, i) => `<div class="dato"><div><div class="mut xs">${f[0]}</div><b>${esc(f[1])}</b></div></div>`).join("") : `<div class="mut sm" style="margin-top:6px">Te enviaremos los datos de transferencia por WhatsApp.</div>`}
    <div class="mut xs" style="padding-top:8px">Tu pedido queda <b>reservado por 2 horas</b>. Se confirma cuando recibimos la transferencia; si no la recibimos en ese plazo, lo liberamos.</div></div>
  <div class="card" style="margin-top:12px"><div class="fila" style="justify-content:flex-start"><span class="mini">2</span><b style="font-size:16px">Envíanos el comprobante</b></div>
    ${c.whatsapp ? `<div class="mut sm" style="margin:6px 0 10px">Mándalo por WhatsApp para que sepamos que ya pagaste.</div><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent(texto)}">💬 Enviar comprobante por WhatsApp</a>` : `<div class="mut sm" style="margin-top:6px">Escríbenos por Instagram @alfajores_vicencio con el comprobante.</div>`}</div>
  <div class="card" style="margin-top:12px"><div class="fila" style="justify-content:flex-start"><span class="mini">3</span><b style="font-size:16px">Coordinamos la entrega</b></div>
    ${desp ? `<div class="sm" style="margin-top:6px">🚗 Despacho a ${esc(dir)}, ${esc(comuna)}</div><div class="mut xs">Te escribimos para coordinar el día y la hora.${coordinar ? " El costo del envío lo vemos por WhatsApp." : ""}</div>`
           : `<div class="sm" style="margin-top:6px">${esc(c.entrega)}</div><div class="mut xs">Te escribimos para confirmar el lugar y la hora.</div>`}</div>
  ${c.whatsapp ? `<a class="btn out" style="margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent("Hola! Tengo una consulta sobre mi pedido de " + frase(ped.lineas) + ".")}">💬 Tengo una consulta</a>` : ""}
  <p class="mut sm" style="text-align:center">Puedes cerrar esta página. ¡Gracias por apoyar a Alfajores Vicencio! 🤎</p>`;
  const b = $("#cptodo"); if (b) b.onclick = () => copiar(filas.map((f) => f[1]).join("\n"), "Datos copiados ✅ Pégalos en tu app del banco");
}

function barra() {
  const [t, u] = totales();
  const e = st.paso === 2 ? envioActual() : 0;
  $("#tot").textContent = peso(t + (e || 0));
  $("#unid").textContent = `${u} alfajor${u !== 1 ? "es" : ""}` + (st.paso === 2 && st.entrega === "despacho" ? (e ? " + envío" : e === null ? " · envío por coordinar" : " · envío sin costo") : "");
  $("#barra").hidden = st.paso === 3;
  const f1 = $("#falta1");
  if (f1 && st.paso === 1) {
    const f = faltaGratis(), fue = st.entrega === "despacho" && despachoActivo() && (st.cat.despacho.comunas || []).indexOf(st.comuna) >= 0;
    f1.hidden = !fue;
    f1.innerHTML = f > 0 ? `🚗 Te faltan <b>${peso(f)}</b> para tu envío gratis a ${esc(st.comuna)}.` : `🚗 ¡Listo! Tu envío a ${esc(st.comuna)} es gratis.`;
  }
  $("#atras").hidden = st.paso !== 2;
  $("#sig").textContent = st.paso === 1 ? "Continuar →" : (st.enviando ? "Enviando…" : "Confirmar pedido");
  $("#sig").disabled = (st.paso === 1 && u <= 0) || st.enviando;
}

function irA(p) { st.paso = p; window.scrollTo(0, 0); (p === 1 ? dibujarPaso1 : dibujarPaso2)(); barra(); }

async function enviar() {
  const tel = (st.tel || "").replace(/\D/g, "");
  if (tel.length !== 8) { avisar("Escribe los 8 números de tu celular, los que van después del +569."); return; }
  if ((st.nombre || "").trim().length < 2) { avisar("Escribe tu nombre."); return; }
  if (st.entrega === "despacho" && despachoActivo()) {
    if (!comunaElegida()) { avisar("Elige tu comuna para el despacho."); return; }
    if ((st.direccion || "").trim().length < 5) { avisar("Escribe tu dirección para el despacho."); return; }
  }
  st.enviando = true; barra();
  try {
    const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ accion: "pedido", ref: st.ref, nombre: st.nombre, telefono: tel, nota: st.nota || "", cantidades: st.cant,
        entrega: despachoActivo() ? st.entrega : "retiro", comuna: comunaElegida(), direccion: st.direccion || "", trampa: ($("#trampa") || {}).value || "" }) });
    const d = await r.json();
    st.enviando = false;
    if (!d.ok) { avisar(d.error || "No pudimos guardar tu pedido. Intenta de nuevo."); barra(); return; }
    st.paso = 3; window.scrollTo(0, 0); barra(); dibujarPaso3(d.pedido, d.pago || {});
  } catch (e) {
    st.enviando = false; barra();
    avisar("Sin conexión. Revisa tu internet e intenta de nuevo.");
  }
}

$("#atras").onclick = () => irA(1);
$("#sig").onclick = () => { if (st.paso === 1) { if (totales()[1] > 0) irA(2); } else enviar(); };

async function iniciar() {
  const sub = $("#sub");
  if (!window.API_URL) { sub.textContent = "Esta página aún no está conectada."; return; }
  try {
    const r = await fetch(window.API_URL); const c = await r.json();
    if (!c.ok) throw new Error();
    st.cat = c;
    if (!c.activo) {
      sub.textContent = "Pedidos de alfajores";
      $("#cuerpo").innerHTML = `<div class="card"><b>Por ahora no estamos tomando pedidos 🙏</b><div class="mut sm" style="margin-top:6px">Escríbenos por Instagram @alfajores_vicencio y te ayudamos.</div></div>`;
      return;
    }
    sub.textContent = "Haz tu pedido en 3 pasos";
    irA(1);
  } catch (e) {
    sub.textContent = "No pudimos cargar la página. Intenta de nuevo en un momento o escríbenos por Instagram @alfajores_vicencio.";
  }
}
iniciar();
</script>
</body>
</html>
