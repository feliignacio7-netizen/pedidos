<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3EEE6">
<title>Tu opinión · Alfajores Vicencio</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Pagella;src:url(pagella.otf)}
:root{--bg:#F3EEE6;--sup:#FBF8F3;--bor:#E0D4C4;--bor2:#D3C4B1;--hov:#EBE2D5;--fg:#2A1A12;--mut:#6B4A35;--pri:#BC7B69;--pri-t:#8F5444;--star:#C08A4B;--serif:'Pagella','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;gap:12px}
.logo{display:block;width:min(260px,70vw);margin:0 auto}
.card{background:var(--sup);border:1px solid var(--bor);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(42,26,18,.06)}
h1{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2;margin:0 0 6px}
.mut{color:var(--mut)}.sm{font-size:14px}
.estrellas{display:flex;justify-content:center;gap:6px;margin:16px 0 4px}
.estrellas button{background:none;border:0;font-size:46px;line-height:1;color:var(--bor2);cursor:pointer;padding:2px 4px;touch-action:manipulation}
.estrellas button.on{color:var(--star)}
.etq{text-align:center;min-height:20px;color:var(--mut);font-size:14px;font-weight:500}
textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sup);border:1px solid var(--bor2);border-radius:6px;padding:14px;margin-top:12px;outline:none;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.btn{height:52px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:600;background:var(--pri);color:var(--fg);padding:0 22px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;margin-top:12px;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn.wa{background:#2E7D4F;color:#fff}.btn.out{background:transparent;border:1px solid var(--pri);color:var(--pri-t);height:46px;font-size:15px}
.trampa{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.aviso{color:#9A3B2B;font-size:14px;margin-top:8px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.svg" alt="Vicencio · alfajores artesanales">
  <div class="card" id="form">
    <h1>¿Qué te parecieron tus alfajores?</h1>
    <div class="mut sm">Tu opinión nos ayuda muchísimo. Toma 10 segundos 🤎</div>
    <div class="estrellas" id="est"></div>
    <div class="etq" id="etq"></div>
    <textarea id="com" rows="3" placeholder="Cuéntanos qué te gustó o qué podemos mejorar (opcional)"></textarea>
    <input class="trampa" id="trampa" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="aviso" id="aviso" hidden></div>
    <button class="btn" id="enviar" disabled>Enviar mi opinión</button>
  </div>
  <div class="card" id="gracias" hidden></div>
</div>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ref = new URLSearchParams(location.search).get("p") || "";
const FRASES = ["", "Lo sentimos mucho 😔", "Podemos mejorar", "Bien, gracias", "¡Qué bueno! 😊", "¡Nos encanta! 🤩"];
const PEDIDOS = location.href.replace(/opinion\.html.*$/, "");
let n = 0;
const est = $("#est");
for (let i = 1; i <= 5; i++) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = "★"; b.setAttribute("aria-label", i + " estrellas");
  b.onclick = () => { n = i; pintar(); }; est.appendChild(b);
}
function pintar() { [...est.children].forEach((b, i) => b.classList.toggle("on", i < n)); $("#etq").textContent = FRASES[n]; $("#enviar").disabled = !n || !ref; }
function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
if (!ref) { const a = $("#aviso"); a.hidden = false; a.textContent = "Este link no es válido. Pídenos uno nuevo por WhatsApp."; }

$("#enviar").onclick = async () => {
  const b = $("#enviar"), a = $("#aviso"); b.disabled = true; b.textContent = "Enviando…"; a.hidden = true;
  try {
    const r = await fetch(window.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ accion: "opinion", ref, estrellas: n, comentario: $("#com").value, trampa: $("#trampa").value }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "No pudimos guardar tu opinión.");
    gracias();
  } catch (e) {
    a.hidden = false; a.textContent = (e && e.message && !/fetch|network/i.test(e.message)) ? e.message : "Sin conexión. Intenta de nuevo.";
    b.disabled = false; b.textContent = "Enviar mi opinión";
  }
};

function gracias() {
  $("#form").hidden = true; const g = $("#gracias"); g.hidden = false;
  const texto = "Prueba los alfajores de Vicencio 🤎🤍 Negro y blanco, artesanales. Pídelos aquí: " + PEDIDOS;
  if (n >= 4) {
    g.innerHTML = `<h1>¡Muchas gracias! 🤎</h1><div class="mut sm">Nos alegra que te hayan gustado. Si quieres ayudarnos, recomiéndanos con tus amigos y familia:</div>
      <button class="btn" id="comp" hidden>📲 Compartir en mis redes</button>
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(texto)}">💬 Recomendar por WhatsApp</a>
      <a class="btn out" target="_blank" rel="noopener" href="https://www.instagram.com/alfajores_vicencio/">Síguenos en Instagram @alfajores_vicencio</a>
      <button class="btn out" id="cp">Copiar link para compartir</button>`;
    if (navigator.share) { $("#comp").hidden = false; $("#comp").onclick = () => navigator.share({ title: "Alfajores Vicencio", text: texto, url: PEDIDOS }).catch(() => {}); }
    $("#cp").onclick = () => { const ok = () => $("#cp").textContent = "Link copiado ✅";
      if (navigator.clipboard) navigator.clipboard.writeText(PEDIDOS).then(ok, () => {}); };
  } else {
    g.innerHTML = `<h1>Gracias por contarnos 🤎</h1><div class="mut sm">Tomamos tu opinión muy en serio y vamos a trabajar en mejorar. Si quieres, escríbenos por Instagram @alfajores_vicencio y lo conversamos.</div>
      <a class="btn out" target="_blank" rel="noopener" href="https://www.instagram.com/alfajores_vicencio/">Ir a Instagram</a>`;
  }
}
pintar();
</script>
</body>
</html>
